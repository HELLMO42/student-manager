<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface-container": "#eeeeee",
                        "tertiary-fixed": "#ffdbca",
                        "surface": "#f9f9f9",
                        "on-tertiary-container": "#d8885c",
                        "tertiary": "#381300",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f4f3f3",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-container": "#5f6161",
                        "on-background": "#1a1c1c",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#723610",
                        "on-surface-variant": "#43474f",
                        "surface-tint": "#3a5f94",
                        "surface-dim": "#dadada",
                        "primary-fixed": "#d5e3ff",
                        "tertiary-fixed-dim": "#ffb690",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001b3c",
                        "secondary-container": "#dcdddd",
                        "inverse-on-surface": "#f1f1f1",
                        "background": "#f9f9f9",
                        "primary-container": "#003366",
                        "on-primary-container": "#799dd6",
                        "surface-variant": "#e2e2e2",
                        "surface-bright": "#f9f9f9",
                        "primary": "#001e40",
                        "secondary": "#5d5f5f",
                        "outline": "#737780",
                        "secondary-fixed": "#e2e2e2",
                        "outline-variant": "#c3c6d1",
                        "tertiary-container": "#592300",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#a7c8ff",
                        "on-surface": "#1a1c1c",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#341100",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#1f477b",
                        "primary-fixed-dim": "#a7c8ff",
                        "inverse-surface": "#2f3131"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "margin-page": "40px",
                        "sidebar-width": "240px",
                        "container-max-width": "1200px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "sidebar-link": ["Inter"],
                        "h2": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "h3": ["Inter"],
                        "h1": ["Inter"]
                    },
                    "fontSize": {
                        "sidebar-link": ["15px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h3": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #f9f9f9;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden">
    <!-- NavigationDrawer (Shared Component) -->
    <aside
        class="fixed left-0 top-0 h-screen w-[240px] z-40 bg-[#003366] dark:bg-slate-950 flex flex-col h-full py-6 border-r border-blue-800 dark:border-slate-800 hidden md:flex">
        <!-- Brand / Header -->
        <div class="px-6 mb-10 flex flex-col gap-1">
            <span class="text-white text-xl font-bold tracking-tight">EduCore LMS</span>
            <div class="flex items-center gap-3 mt-6">
                <img alt="Professor Smith" class="w-10 h-10 rounded-[100%]"
                    data-alt="Professional portrait of a middle-aged academic man with glasses in a clean office setting, soft natural lighting"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAg4R0k_dl-n2M6VY9LI61JRwS7NqDQZJpwKO57yIxwlIXW30CBAUf9zNFVylE3E2UnTx-15hfGrcoXO-c0HKbg6C9pwrp1JQhcVNEpo0UKvZ72AG4-SdKUYSty4R1POy2pRRFVKnVmdgfY5nIuwF4s_6HKmf9HRX6MDq9K4gZIk8IdT_4GI5yDlqhgTUzqUAUeLaZBZsPgQR4fWtcIbn0mzzSwuScRdApPwBZWKG837GDCCGyTd3VIImdSpclF7ROZu9vjylO9APvB" />
                <div class="flex flex-col">
                    <span class="text-white font-sidebar-link text-sidebar-link">Professor Smith</span>
                    <span class="text-blue-200/60 text-xs font-medium">Lead Instructor</span>
                </div>
            </div>
        </div>
        <!-- Navigation Links -->
        <nav class="flex-1">
            <ul class="space-y-1">
                <!-- Dashboard (Active) -->
                <li>
                    <a class="flex items-center gap-3 px-4 py-3 text-blue-100/70 hover:text-white hover:bg-white/5 font-inter text-sm font-medium transition-all duration-200"
                        href="">
                        <span class="material-symbols-outlined" data-icon="dashboard"
                            style="font-variation-settings: 'FILL' 1;">dashboard</span>
                        <span>Dashboard</span>
                    </a>
                </li>
                <!-- My Courses -->
                <li>
                    <a class="flex items-center gap-3 px-4 py-3 bg-white/10 text-white border-l-4 border-white font-inter text-sm font-medium transition-all duration-200"
                        href="courseHome.html">
                        <span class="material-symbols-outlined" data-icon="school">school</span>
                        <span>My Courses</span>
                    </a>
                </li>
                <!-- Calendar -->
                <li>
                    <a class="flex items-center gap-3 px-4 py-3 text-blue-100/70 hover:text-white hover:bg-white/5 font-inter text-sm font-medium transition-all duration-200"
                        href="#">
                        <span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
                        <span>Calendar</span>
                    </a>
                </li>
                <!-- Settings -->
                <li>
                    <a class="flex items-center gap-3 px-4 py-3 text-blue-100/70 hover:text-white hover:bg-white/5 font-inter text-sm font-medium transition-all duration-200"
                        href="#">
                        <span class="material-symbols-outlined" data-icon="settings">settings</span>
                        <span>Settings</span>
                    </a>
                </li>
                <li>
                    <a class="flex items-center gap-3 px-4 py-3 text-blue-100/70 hover:text-white hover:bg-white/5 font-inter text-sm font-medium transition-all duration-200"
                        href="#">
                        <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                        <span>Notifications</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>
    <main class="ml-[240px] min-h-screen">
        <!-- TopAppBar (Shared Component) -->
        {% include 'headers/courseHeader.html' %}
        <span class="block h-6"></span>
        {% include pageContent %} 
    </main>
</body>
