<!doctype html>

<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Login | LMS Global</title>
        <!-- Material Symbols -->
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Google Fonts: Inter -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "surface-bright": "#f9f9f9",
                            surface: "#f9f9f9",
                            "on-surface-variant": "#43474f",
                            "on-primary": "#ffffff",
                            "on-tertiary-fixed": "#341100",
                            error: "#ba1a1a",
                            "on-surface": "#1a1c1c",
                            tertiary: "#381300",
                            "on-error": "#ffffff",
                            "inverse-on-surface": "#f1f1f1",
                            background: "#f9f9f9",
                            "surface-container": "#eeeeee",
                            "outline-variant": "#c3c6d1",
                            "surface-container-lowest": "#ffffff",
                            "error-container": "#ffdad6",
                            "primary-container": "#003366",
                            "tertiary-container": "#592300",
                            "surface-dim": "#dadada",
                            outline: "#737780",
                            "on-primary-container": "#799dd6",
                            "inverse-primary": "#a7c8ff",
                            "on-primary-fixed-variant": "#1f477b",
                            "on-tertiary-fixed-variant": "#723610",
                            "secondary-container": "#dcdddd",
                            "primary-fixed-dim": "#a7c8ff",
                            "secondary-fixed-dim": "#c6c6c7",
                            "surface-container-highest": "#e2e2e2",
                            "primary-fixed": "#d5e3ff",
                            secondary: "#5d5f5f",
                            primary: "#001e40",
                            "surface-variant": "#e2e2e2",
                            "on-background": "#1a1c1c",
                            "on-tertiary": "#ffffff",
                            "on-secondary-fixed": "#1a1c1c",
                            "on-secondary-fixed-variant": "#454747",
                            "on-secondary-container": "#5f6161",
                            "surface-tint": "#3a5f94",
                            "on-primary-fixed": "#001b3c",
                            "secondary-fixed": "#e2e2e2",
                            "on-secondary": "#ffffff",
                            "on-tertiary-container": "#d8885c",
                            "on-error-container": "#93000a",
                            "surface-container-low": "#f4f3f3",
                            "tertiary-fixed-dim": "#ffb690",
                            "tertiary-fixed": "#ffdbca",
                            "inverse-surface": "#2f3131",
                            "surface-container-high": "#e8e8e8",
                        },
                        borderRadius: {
                            DEFAULT: "0.125rem",
                            lg: "0.25rem",
                            xl: "0.5rem",
                            full: "0.75rem",
                        },
                        spacing: {
                            "stack-sm": "8px",
                            gutter: "24px",
                            "stack-lg": "32px",
                            "container-max-width": "1200px",
                            "sidebar-width": "240px",
                            "stack-md": "16px",
                            "margin-page": "40px",
                        },
                        fontFamily: {
                            "sidebar-link": ["Inter"],
                            h1: ["Inter"],
                            "body-md": ["Inter"],
                            h3: ["Inter"],
                            h2: ["Inter"],
                            "body-lg": ["Inter"],
                            "label-sm": ["Inter"],
                        },
                        fontSize: {
                            "sidebar-link": ["15px", { lineHeight: "1.0", fontWeight: "500" }],
                            h1: ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }],
                            "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                            h3: ["20px", { lineHeight: "1.4", fontWeight: "600" }],
                            h2: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                            "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                            "label-sm": ["14px", { lineHeight: "1.2", letterSpacing: "0.01em", fontWeight: "500" }],
                        },
                    },
                },
            };
        </script>
        <style>
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 400,
                    "GRAD" 0,
                    "opsz" 24;
            }
            body {
                background-color: #f9f9f9;
            }
            .login-card {
                box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.05);
                border: 1px solid #e0e0e0;
            }
        </style>
    </head>
    <body class="font-body-md text-on-surface antialiased flex flex-col min-h-screen">
        <main class="flex-grow flex items-center justify-center p-gutter">
            <!-- Login Container -->
            <div class="w-full max-w-[440px] flex flex-col items-center">
                <!-- Brand Logo (Top) -->
                <div class="mb-stack-lg flex flex-col items-center gap-2">
                    <span class="material-symbols-outlined text-primary-container text-4xl">school</span>
                    <span class="font-h2 text-primary-container uppercase tracking-wider font-extrabold"
                        >LMS Global</span
                    >
                </div>
                <!-- Login Card -->
                <div class="bg-surface-container-lowest login-card w-full p-10 rounded-lg">
                    <div class="mb-stack-lg">
                        <h1 class="font-h1 text-on-surface text-center mb-2">Sign In</h1>
                        <p class="font-label-sm text-on-surface-variant text-center">
                            Enter your credentials to access your academic portal.
                        </p>
                    </div>
                    <form class="space-y-stack-md" id="loginForm" type="POST" action="{% url 'loginPage' %}">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <!-- Login Button -->
                        <button
                            class="w-full bg-primary-container text-on-primary font-h3 py-3 rounded hover:bg-primary transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2 mt-4"
                            type="submit"
                        >
                            Login
                            <span class="material-symbols-outlined text-xl">arrow_forward</span>
                        </button>
                    </form>
                    <!-- Footer Links Inside Card -->
                </div>
                <!-- Page Footer Information -->
                <footer class="mt-stack-lg text-center">
                    <p class="font-label-sm text-outline">
                        © 2024 LMS Global Academic Systems. <br />
                        <span class="mt-1 block opacity-70">Privacy Policy • Terms of Service • Help Desk</span>
                    </p>
                </footer>
            </div>
        </main>
        <!-- Decoration Element (Subtle Background Detail) -->
        <div class="fixed top-0 right-0 p-12 opacity-[0.03] pointer-events-none select-none">
            <span class="material-symbols-outlined text-[300px]" style="font-variation-settings: &quot;FILL&quot; 1"
                >account_balance</span
            >
        </div>
    </body>
</html>
