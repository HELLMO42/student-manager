<div
            class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity duration-200"
            id="restore-course-modal"
        >
      <div
                class="bg-surface-container-lowest border border-outline-variant rounded-lg shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95"
            >
        <div
                    class="flex items-center justify-between px-6 py-4 border-b border-outline-variant bg-surface-container-low"
                >
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-xl">
              restore_from_trash
            </span>
            <h3 class="text-base font-semibold text-primary font-h3">
              Restore Course
            </h3>
          </div>
          <button
                        class="p-1 text-secondary hover:text-primary hover:bg-surface-container rounded transition-colors"
                        id="close-restore-modal-x"
                    >
            <span class="material-symbols-outlined text-xl">
              close
            </span>
          </button>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-primary uppercase tracking-wider mb-2 font-inter" for="course-select">
              Course ID
            </label
                        >
            <div class="relative">
              <input class="w-full px-3 py-2 rounded border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-sm" type="int" placeholder="Enter Course ID to restore" id="input-restore-course-id"/>
            </div>
          </div>
          <div id="restore-error-message" class="text-xs text-error font-medium">
            <p>Please enter a valid Course ID.</p>
          </div>
          <div class="pt-2 flex items-center justify-end gap-3">
            <button
                            class="px-4 py-2 border border-outline-variant hover:bg-surface-container text-secondary hover:text-primary rounded text-sm font-medium font-inter transition-colors"
                            id="cancel-restore-btn"
                            type="button"
                        >
              Cancel
            </button
                        >
            <button
                            class="px-4 py-2 bg-[#ba1a1a] hover:bg-[#93000a] text-white rounded text-sm font-medium font-inter transition-colors flex items-center gap-1.5"
                            id="restore-button"
                            type="button"
                        >
              <span class="material-symbols-outlined text-base">
                restore
              </span>
              <span>
                Restore Course
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
